<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title> Login </title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <!-- Link CSS -->
    <link rel="stylesheet" href="./../style/login.css" />
</head>

<body class="d-flex justify-content-center">
    <!-- Main Content -->
    <div class="container">
        <img src="../assets/icon/logo-buseet.png" width="200px" alt="" />
        <h2 class="fs-1">Login</h2>
        <form action="../../index.html" class="text-center login-input">
            <!-- Email Input -->
            <div class="mb-3 col-5 text-start fs-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" name="email" id="email" aria-describedby="emailHelp" placeholder="Enter Your Email" />
            </div>

            <!-- Password Input -->
            <div class="mb-3 col-5 text-start fs-6">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter Your Password" />
            </div>

            <div class="mb-3 form-check col-5 text-start d-flex justify-content-between">
                <div>
                    <input type="checkbox" class="form-check-input" id="exampleCheck1" />
                    <label class="form-check-label" for="exampleCheck1">Remember me</label>
                </div>
                <div>
                    <a href="">Forgot Password?</a>
                </div>
            </div>
            <!-- Login Button -->
            <a href="../../index.html" class="text-decoration-none">
                <button type="submit" class="btn btn-light btn-outline-primary d-block mb-4 col-3"> Login </button>
            </a>
            <p class="fw-bold">Sign-In With</p>
            <!-- Google And Facebook Login Icon Start -->
            <div class="row m-auto text-center login-way mb-3">
                <div class="col">
                    <a href="">
                        <img src="../assets/icon/facebook.svg" width="50px" alt="Logo Facebook" />
                    </a>
                </div>
                <div class="col">
                    <a href="">
                        <img src="../assets/icon/google.svg" width="50px" alt="Logo Google" />
                    </a>
                </div>
            </div>
            <!-- Google And Facebook Login Icon End -->
            <p>Don’t have an account? <a href="signup.html" class="text-white fw-bold">Sign up</a></p>
        </form>
    </div>
    <!-- Main Content End -->
    <!-- Bootstrap Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>

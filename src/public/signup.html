<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Sign Up </title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <!-- Link CSS -->
    <link rel="stylesheet" href="./../style/login.css" />
</head>

<body>
    <!-- Main Content Start -->
    <div class="container d-flex justify-content-center align-items-center">
        <div class="col-5">
            <img src="../assets/icon/logo-buseet.png" width="400px" alt="Logo BUSEET" />
        </div>
        <div class="col-5">
            <form action="login.html" class="text-center">
                <!-- Input Full Name -->
                <div class="mb-3 col-12 text-start">
                    <label for="exampleInputEmail1" class="form-label">Full Name</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Enter Your Full Name" />
                </div>

                <!-- Input Email -->
                <div class="mb-3 col-12 text-start">
                    <label for="exampleInputEmail1" class="form-label">Email</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Enter Your Email" />
                </div>

                <!-- Input Password -->
                <div class="mb-3 col-12 text-start">
                    <label for="exampleInputPassword1" class="form-label">Password</label>
                    <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Enter Your Password" />
                </div>

                <!-- Sign up Button -->
                <button type="submit" class="btn btn-light btn-outline-primary d-block mt-4 mb-3 col-6">Sign Up</button>
                <p>Have an account? <a href="login.html" class="text-white fw-bold">Login</a></p>
            </form>
        </div>
    </div>
    <!-- Main Content End -->
    <!-- Bootstrap Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
